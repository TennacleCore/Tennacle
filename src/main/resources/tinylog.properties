locale = en_US

level = info
level@io.github.term4.polyp.presets.mmc18 = debug

writerConsole = console
writerConsole.level = debug
writerConsole.format = {date:HH:mm} {[{level}]|min-size=7} {message|indent=4}

# the dev server runs headless (Start-Process hidden): a file is the only way to read it back
writerFile = file
writerFile.file = logs/tennacle.log
writerFile.append = true
writerFile.level = debug
writerFile.format = {date:HH:mm:ss.SSS} {[{level}]|min-size=7} {message|indent=4}
