locale = en_US
level = info

writerConsole = console
writerConsole.level = debug
writerConsole.format = {date:HH:mm} {[{level}]|min-size=7} {message|indent=4}

# the dev server runs headless (Start-Process hidden): a file is the only way to read it back. Rolling, because
# a plain file writer appends forever and a full disk breaks every durable write on the box
writerFile = rolling file
writerFile.file = logs/tennacle_{count}.log
writerFile.latest = logs/tennacle.log
writerFile.policies = size: 20mb
writerFile.backups = 10
writerFile.level = debug
writerFile.format = {date:yyyy-MM-dd HH:mm:ss.SSS} {[{level}]|min-size=7} [{thread}] {message|indent=4}
